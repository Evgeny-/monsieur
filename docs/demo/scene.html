<!doctype html>
<meta charset="utf-8">
<title>Monsieur</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 800px at 30% 20%, #1d2333, #0d1016 70%);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    color: #e8ecf3;
  }
  .card {
    width: 720px; padding: 28px 30px 24px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    backdrop-filter: blur(20px);
  }
  .row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .to { color: #7d879b; font-size: 13px; }
  .chip {
    font-size: 13px; padding: 3px 10px; border-radius: 20px;
    background: rgba(120,150,255,.16); color: #a9c0ff;
  }
  textarea {
    width: 100%; min-height: 130px; resize: none; border: 0; outline: 0;
    background: transparent; color: inherit; font: inherit; letter-spacing: .1px;
  }
  textarea::placeholder { color: #4d566b; }
  .hint { margin-top: 18px; color: #5b647a; font-size: 12px; }
  kbd {
    font: 11px/1 ui-monospace, monospace; padding: 3px 6px; border-radius: 5px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.09);
    color: #98a3b8;
  }
</style>
<div class="card">
  <div class="row"><span class="to">To</span><span class="chip">#deploys</span></div>
  <textarea autofocus placeholder="Hold a hotkey and say it in any language…"></textarea>
  <div class="hint">Monsieur — press <kbd>F3</kbd>, speak, and it lands here in English.</div>
</div>
<script>document.querySelector("textarea").focus();</script>
